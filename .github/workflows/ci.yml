name: Store CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRIYASA_API_BASE_URL: http://127.0.0.1:8787/api/v1
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PRIYASA_E2E_ENABLED: false
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        if: ${{ env.PRIYASA_E2E_ENABLED == 'true' }}
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        if: ${{ env.PRIYASA_E2E_ENABLED == 'true' }}
        run: npm run test:e2e
