name: Store CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PRIYASA_API_BASE_URL: http://127.0.0.1:8787/api/v1
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PRIYASA_E2E_ENABLED: true
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start deterministic PriyasaCore mock
        run: |
          node tests/e2e/mock-core.mjs > /tmp/priyasa-mock-core.log 2>&1 &
          echo $! > /tmp/priyasa-mock-core.pid
          for i in {1..20}; do
            curl --fail --silent http://127.0.0.1:8787/api/v1/storefront/home >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/priyasa-mock-core.log
          exit 1

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: priyasa-store-e2e-artifacts
          path: |
            test-results/
            playwright-report/
            /tmp/priyasa-mock-core.log
          if-no-files-found: ignore
